name: Repository Hygiene

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject tracked local artifacts
        run: python3 -I -S tests/repository_hygiene.py --all-tracked
